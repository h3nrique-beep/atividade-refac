name: Testes Java 21

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Testar e gerar executável
        run: sh gradlew test bootJar --no-daemon
      - name: Resumo dos testes
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('build/test-results/test').glob('TEST-*.xml'):
              result = ET.parse(path).getroot()
              print(result.attrib)
          PY
